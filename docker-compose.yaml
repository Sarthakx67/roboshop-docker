networks:
  roboshop:
    driver: bridge
services:
  mongodb:
    image: sarthak6700/mongodb:v1
    container_name: mongodb
    networks:
      - roboshop
  catalogue:
    image: sarthak6700/catalogue:v1
    container_name: catalogue
    networks:
      - roboshop
    depends_on:
      - mongodb
  redis:
    image: redis
    container_name: redis
    networks:
      - roboshop
  user:
    image: sarthak6700/user:v1
    container_name: user
    networks:
      - roboshop
    depends_on:
      - mongodb
      - redis
  cart:
    image: sarthak6700/cart:v1
    container_name: cart
    networks:
      - roboshop
    depends_on:
      - redis
      - catalogue
  mysql:
    image: sarthak6700/mysql:v1
    container_name: mysql
    networks:
      - roboshop
  shipping:
    image: sarthak6700/shipping:v1
    container_name: shipping
    networks:
      - roboshop
    depends_on:
      - mysql
      - cart
  rabbitmq:
    image: rabbitmq
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=roboshop
      - RABBITMQ_DEFAULT_PASS=roboshop123
    networks:
      - roboshop
  payment:
    image: sarthak6700/payment:v1
    container_name: payment
    networks:
      - roboshop
    depends_on:
      - cart
      - user
      - rabbitmq
  web:
    image: sarthak6700/web:v1
    container_name: web
    networks:
      - roboshop
    ports:
      - "80:80"
    depends_on:
      - catalogue
      - user  
      - cart
      - shipping
      - payment